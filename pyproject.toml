[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations"]

[tool.ruff.lint]
# Дефолты (E, F) плюс три семейства, которые в этом коде реально что-то ловят:
# B — bugbear, I — порядок импортов, UP — устаревшие конструкции.
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# В тестах импорты внутри методов — осознанный приём: он держит зависимость
# рядом с тем единственным тестом, которому она нужна.
"**/tests/*" = ["E402"]
