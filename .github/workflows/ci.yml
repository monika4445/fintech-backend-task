name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Сьюта ходит в настоящий PostgreSQL, а не в SQLite, и это принципиально:
    # на SQLite Django молча выбрасывает SELECT ... FOR UPDATE из запроса
    # (django/db/models/sql/compiler.py), поэтому тесты на блокировки, на план
    # запроса и на соответствие схемы там не проверяли бы ничего.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      DOMAIN: example.com
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --buffer
