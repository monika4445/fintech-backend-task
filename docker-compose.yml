x-django-env: &django-env
  DOMAIN: ${DOMAIN:?DOMAIN is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DEBUG: ${DEBUG:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  # Брокер и кэш это разные инстансы, см. комментарии у сервисов ниже.
  CELERY_BROKER_URL: redis://redis-broker:6379/0
  REDIS_URL: redis://redis-cache:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Брокер очереди. noeviction и persistence обязательны.
  # С allkeys-lru Redis под нагрузкой начинает вытеснять ключи очереди, и
  # сообщения Celery пропадают молча: продюсер уже получил подтверждение и
  # ошибки не увидит. С --save "" тот же эффект даёт любой рестарт.
  redis-broker:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Кэш. Здесь вытеснение как раз уместно: данные восстановимы, все ключи
  # живут с TTL, потеря ключа означает лишь промах мимо кэша.
  redis-cache:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции отдельным одноразовым запуском, а не в командах app и worker.
  # Иначе `--scale app=3` стартует три контейнера, которые накатывают миграции
  # параллельно, и результат зависит от содержимого конкретной миграции.
  migrate:
    build:
      context: .
      target: base
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    environment: *django-env
    volumes:
      - static:/app/static
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: base
    environment: *django-env
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${DOMAIN:?}\" http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: base
    command: celery -A config worker -l INFO --concurrency 4
    environment: *django-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    # command НЕ переопределяется намеренно. /docker-entrypoint.sh запускает весь
    # блок инициализации (envsubst по шаблонам и наши скрипты) только при условии
    # [ "$$1" = "nginx" ]. Любой `command: sh -c ...` подставляет туда sh, гейт не
    # открывается, шаблоны молча не рендерятся и nginx поднимается на дефолтном
    # конфиге. Проверено вживую: симптом это 404 вместо проксирования, без единой
    # строки ошибки в логах. Периодический reload вынесен в docker-entrypoint.d.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Включает штатный 15-local-resolvers.envsh, который кладёт адрес
      # встроенного DNS докера в NGINX_LOCAL_RESOLVERS. Без него resolver в
      # шаблоне отрендерится пустым и nginx не стартует.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      # Шаблоны монтируются, а не копируются в образ. Иначе привязка к домену
      # уехала бы в слой образа и пересборка снова понадобилась бы.
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      # Пофайлово, а не каталогом: /docker-entrypoint.d/ ищет скрипты
      # рекурсивно и сортирует по полному пути, так что вложенная папка меняет
      # порядок исполнения неочевидным образом.
      - ./docker/nginx/entrypoint.d/40-select-tls-mode.sh:/docker-entrypoint.d/40-select-tls-mode.sh:ro
      - ./docker/nginx/entrypoint.d/50-reload-on-cert-renewal.sh:/docker-entrypoint.d/50-reload-on-cert-renewal.sh:ro
      - static:/app/static:ro
      - media:/app/media:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # БЕЗ profiles. Раньше этот сервис был под profiles: ["tls"], и
  # задокументированный `docker compose up -d` не поднимал его никогда — то есть
  # продление сертификата не выполнялось вообще, а истечение на 90-й день было
  # не риском, а запланированной аварией.
  certbot:
    image: certbot/certbot
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

  # Сьюта ходит в настоящий Postgres, а не в SQLite. На SQLite
  # has_select_for_update = False, и Django молча выкидывает FOR UPDATE из
  # запроса (django/db/models/sql/compiler.py:840) — без ошибки и без варнинга.
  # Тесты при этом зелёные, а защиты от гонки нет вообще.
  #   docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
  redis-broker-data:
  static:
  media:
  certbot-conf:
  certbot-www:
